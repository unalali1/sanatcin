name: SanatCin CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Probe The Paper listings and an article (PR only)
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/thepaper-culture-sections-20261012'
        run: node dev/thepaper-smoke.mjs
